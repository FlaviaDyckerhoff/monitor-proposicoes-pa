name: Monitor Proposições PA

env:
  TZ: America/Sao_Paulo

on:
  schedule:
    - cron: '6 10 * * 1-5'   # 07:06 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Executar monitor
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: node monitor.js

      - name: Salvar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || git commit -m "chore: atualiza estado [skip ci]"
          for tentativa in 1 2 3; do
            git pull --rebase origin main
            git push && break
            if [ "$tentativa" = "3" ]; then
              exit 1
            fi
            sleep 2
          done
